paths:
  data_root: /mnt/data/ats_resources
  p12_root: /mnt/data/ats_resources/data/p12
  physiome_root: /mnt/data/ats_resources/data/physiome
  timeimm_root: /mnt/data/ats_resources/data/timeimm
  mimic_root: /mnt/data/ats_resources/data/mimic
  bits_src: /mnt/data/ats_resources/vendor/bits_tmp
  results_root: results
  log_root: log
  vis_root: vis
  cache_root: results/_cache
  resource_lock: resources.lock.json
llm:
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  base_url_env: ATS_LLM_BASE_URL
  api_key: EMPTY
  api_key_env: ATS_LLM_API_KEY
  model: deepseek-v4.1-flash-economy
  provider: ark
  temperature: 0.2
  max_tokens: 4096
  enable_thinking: false
  timeout: 180
  max_retries: 1
  transport: openai
resources:
  astgi_source: /mnt/data/ats_resources/vendor/bits_tmp/src/ts_benchmark/baselines/ASTGI/ASTGI_model.py
  apn_source: /mnt/data/ats_resources/vendor/bits_tmp/src/ts_benchmark/baselines/APN/APN_model.py
  qwen_model_dir: /mnt/data/Qwen3.5-4B
  vllm_host: 127.0.0.1
  vllm_port: 8848
  vllm_served_name: Qwen3.5-4B
  vllm_gpu_memory_utilization: 0.85
  vllm_max_model_len: 32768
  vllm_tensor_parallel_size: 1
  vllm_max_num_seqs: 64
  hf_endpoint: https://hf-mirror.com
  git_mirror: https://ghproxy.net/
  download_manifest: /mnt/data/ats_resources/download_manifest.json
  tfmixer_source: /mnt/data/ats_resources/vendor/TFMixer/source/models/TFMixer.py
  kafnet_source: /mnt/data/ats_resources/vendor/KAFNet/source/KAFNet/model/KAFNet.py
  hyperimts_source: /mnt/data/ats_resources/vendor/PyOmniTS/source/models/HyperIMTS.py
  tiweaver_source: /mnt/data/ats_resources/vendor/bits_tmp/src/ts_benchmark/baselines/TiWeaver/TiWeaver_model.py
  tpatchgnn_source: /mnt/data/ats_resources/vendor/bits_tmp/src/ts_benchmark/baselines/tPatchGNN/tPatchGNN_model.py
  upstream_model_params:
    TFMixer:
      d_model: 32
      tfmixer_num_freqs: 32
      tfmixer_npatch: 16
      tfmixer_te_dim: 10
      tfmixer_nlayer: 1
      tfmixer_tf_layer: 2
      tfmixer_K: 16
      mask_revin: true
    KAFNet:
      K: 4
      hid_dim: 64
      te_dim: 10
      preconvdim: 16
      nhead: 1
      nlayer: 2
    HyperIMTS:
      d_model: 32
      n_layers: 2
      n_heads: 4
    TiWeaver:
      d_model: 64
      d_ff: 128
      e_layers: 3
      n_heads: 2
      activation: gelu
      min_patch_size: 4
      threshold: 0.5
    tPatchGNN:
      hid_dim: 32
      node_dim: 10
      nhead: 4
      tf_layer: 2
      hop: 1
      outlayer: Linear
      nlayer: 2
  tsci_dir: /mnt/data/ats_resources/vendor/TimeSeriesScientist/source
  tsrouter_dir: /mnt/data/ats_resources/vendor/TSRouter/source
budget:
  trial_timeout_seconds: 600
  trials: 12
  llm_calls: 24
  gpu_hours: 2.0
  patience: 3
seeds:
- 0
- 1
- 2
evaluation:
  metric_version: v2_entity_variable_macro
  primary_metric: normalized_mae
  split_ratios:
    train: 0.6
    search: 0.2
    confirm: 0.1
    test: 0.1
  long_gap_hours: 6.0
  stale_age_hours: 3.0
  density_ratio_threshold: 2.0
  min_valid_targets: 1
fault_detection: false
resource_status:
  p12_set_a: available
  physiome_ode: pending
  timeimm_epa_air: pending
  mimic_iv: blocked_access
  bits_upstream: source_only
